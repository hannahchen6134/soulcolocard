<body>
  <div class="app" data-screen="welcome">
    <div class="ambient" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i></div>
    <header><div class="brand">內在色彩卡<small>SOUL COLOR</small></div><div class="deck-count">105 COLORS</div></header>
    <main>
      <section class="screen active" id="welcome">
        <div class="intro">
          <h1>抽一張色票<br>看看此刻的內心</h1>
          <p class="lead">牌卡不替你定義情緒，只陪你靠近此刻的感受。</p>
          <div class="welcome-actions"><button class="primary" id="startDraw">抽一張色票</button><button class="secondary" id="openOverview">瀏覽全部色票</button></div>
        </div>
        <div class="deck-stage" aria-hidden="true"><div class="soft-orbit"></div><div class="deck"><div class="deck-face"><div class="deck-mark"><span class="deck-star">✦</span><small>Soul Color</small></div></div></div></div>
      </section>

      <section class="screen" id="draw" aria-labelledby="cardTitle">
        <div class="visual" id="visual">
          <canvas id="blendCanvas" aria-hidden="true"></canvas><div class="vignette"></div>
          <div class="visual-status" id="visualStatus">CARD 01 · WAITING TO REVEAL</div>
          <button class="card-button" id="cardButton" aria-label="翻開牌卡">
            <span class="flip-card"><span class="face back"><span class="card-star">✦</span><small>CLICK TO REVEAL</small></span><span class="face front" id="cardFront">
              <span class="card-band"><span class="card-band-bg" id="cardBandBg"></span><span class="card-band-tex" id="cardTexture"></span><span class="card-band-grad"></span><span class="card-band-glass"></span><span class="card-hex" id="frontHex"></span><span class="card-title"><strong id="frontZh"></strong><em id="frontEn"></em></span></span>
              <span class="card-body"><span class="card-label">SOUL COLOR</span><span class="card-footer"><span>內在色彩卡</span><i id="frontDate"></i></span></span>
            </span></span>
          </button>
          <div class="ritual-stack hidden" id="ritualStack" aria-label="本次混色色票"></div>
          <div class="ritual-hint hidden" id="ritualHint">點選任一張，仔細閱讀</div>
          <button class="scroll-cue hidden" id="scrollCue">閱讀色彩訊息 <span aria-hidden="true">↓</span></button>
          <div class="mix-labels hidden" id="mixLabels"></div>
        </div>
        <article class="reading">
          <div class="step" id="stepText">STEP 01 · 翻開牌卡</div>
          <div id="beforeReveal"><h2 id="cardTitle">你的色票已經抽出</h2><p class="lead">先不要猜它是什麼。停一下，準備好時再翻開。</p><button class="primary" id="revealButton">翻開牌卡</button></div>
          <div class="hidden" id="afterReveal">
            <h2 id="readingZh"></h2><div class="en" id="readingEn"></div><p class="story" id="readingStory"></p><p class="question" id="readingQuestion"></p>
            <div class="actions"><button class="primary" id="addCard">再抽一張，形成混色</button><button class="secondary" id="restartReading">重新洗牌</button></div>
          </div>
        </article>
      </section>

      <section class="screen" id="overview" aria-labelledby="overviewTitle">
        <div class="overview-wrap">
          <div class="overview-head">
            <div><div class="eyebrow">THE COMPLETE ARCHIVE · 105 COLORS</div><h2 id="overviewTitle">105 張牌卡完整總覽</h2><p class="overview-copy">這裡直接沿用原始 105 色資料，沒有另外替牌卡命名。你可以搜尋或依色系篩選；點選任何色票即可放大查看原故事與提問。</p></div>
            <button class="secondary" id="overviewBackTop">回到抽牌</button>
          </div>
          <div class="overview-tools"><label class="live" for="paletteSearch">搜尋牌卡名稱或色碼</label><input class="palette-search" id="paletteSearch" type="search" placeholder="搜尋中文名、英文名或 HEX 色碼"><div class="filter-row" id="filterRow" aria-label="依色系篩選"><button class="filter-chip active" data-filter="all">全部</button><button class="filter-chip" data-filter="warm">暖色</button><button class="filter-chip" data-filter="green">綠色</button><button class="filter-chip" data-filter="blue">藍色</button><button class="filter-chip" data-filter="purple">紫色</button><button class="filter-chip" data-filter="neutral">中性色</button></div><div class="result-count" id="paletteCount">105 / 105 CARDS</div></div>
          <div class="palette-list" id="paletteList"></div>
          <div class="overview-foot"><button class="primary" id="overviewBackBottom">回到抽牌，洗牌抽一張</button></div>
        </div>
      </section>

    </main>
    <div class="live" id="announcer" aria-live="polite"></div>
  </div>

  <dialog class="card-dialog" id="cardDialog" aria-labelledby="dialogCardName">
    <div class="dialog-shell"><button class="dialog-close" id="dialogClose" aria-label="關閉完整牌卡">關閉</button><div class="zoom-card" id="zoomCard"></div></div>
  </dialog>

  <script>
const CARDS = [
  {id:"c1",n:1, zh:"爐心", en:"Furnace", hex:"#D83018",bg:["#A81008","#D83018"],m:"鍛劍師把鐵塊推進爐裡，等它燒到通紅。他說，鐵最好打的時候不是最硬的時候，是它剛剛變軟、還帶著熱度的那一刻。那個時刻，什麼形狀都還有可能。",q:"你現在最想做什麼？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c2",n:2, zh:"暮燒", en:"Ember", hex:"#E87030",bg:["#C04818","#E87030"],m:"鐵匠收工前習慣站在門口看一眼夕陽。那道橙光把整條街都燒成暖的，他想起今天敲好的那把鑰匙，不算完美，但是做完了。他轉身回去，覺得今天是算數的。",q:"今天結束了，你還好嗎？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c3",n:3, zh:"琥珀時", en:"Time Sealed", hex:"#C86018",bg:["#A04010","#C86018"],m:"玻璃工匠把一塊琥珀拿到光下，裡面有一隻幾千年前的小蟲，姿勢像是還在飛。他看了很久，說不清楚那是一種什麼感覺，那是某種時間停下來的踏實與充實。",q:"有什麼事你沒辦法忘？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c4",n:4, zh:"柿霜", en:"Frosted", hex:"#D06828",bg:["#A84818","#D06828"],m:"果園的柿子掛了整個秋天，從硬的等到軟的，從澀的等到甜的。沒有人催它，它自己知道什麼時候好了。摘下來的那一天，連空氣都是橙色的。",q:"你在等一件什麼事？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c5",n:5, zh:"土根", en:"Earth Root", hex:"#C04828",bg:["#903018","#C04828"],m:"製陶的老婦人蹲下來，抓起一把土，捏了捏，放回去。她說，這裡的土有韌性，不是每一塊土都這樣，你要先知道你手裡的是哪一種質感與個性，才知道能做什麼形狀。",q:"你的力氣從哪裡來？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c6",n:6, zh:"珊瑚息", en:"Coral Breath", hex:"#E07058",bg:["#C04838","#E07058"],m:"退潮的時候，珊瑚礁就露出來了，粉橘色的，像是海底長出來的城市。漁夫說，珊瑚長得慢，但它是整片海最重要的地方，很多生命都在那裡棲身。",q:"最近什麼事讓你覺得有意義？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c7",n:7, zh:"粉珊瑚", en:"Pink Coral", hex:"#FF9B8A",bg:["#E07860","#FF9B8A"],m:"海底深處的珊瑚,在潮汐間呼吸,在暗流裡綻放。它不需要陽光直射,就能活得那麼鮮豔。生命,總會找到自己的方式發光。",q:"你現在最想見的人是誰？",s:"不需要立刻回答,先感受就好。",tex:"marble"},
  {id:"c8",n:8, zh:"陶痕", en:"Clay Trace", hex:"#A86040",bg:["#804030","#A86040"],m:"陶匠說，她從不用模具。她說，模具做出來的每個都一樣，但手塑的每一個都不一樣，那個歪歪的地方、那個厚一點的邊，是她的手留在裡面的痕跡。",q:"你有什麼別人不知道的地方？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c9",n:9, zh:"柔桃", en:"Soft Peach", hex:"#FFB89E",bg:["#FFA080","#FFB89E"],m:"初戀的溫度就是這樣吧。柔軟,明亮,不用力,卻能把整個心照亮。像清晨的陽光透過窗簾,輕輕落在臉上的那種溫柔。",q:"最近誰讓你覺得被照顧了？",s:"不需要立刻回答,先感受就好。",tex:"marble"},
  {id:"c10",n:10, zh:"樹紋", en:"Tree Ring", hex:"#9A7050",bg:["#785038","#9A7050"],m:"木匠摸著那棵老樹的樹皮，每一道紋路都是一年。他說，你別以為那些紋是傷，那是它長過的證明，它還站著，而且比任何一棵年輕的樹都更難撼動。",q:"你走到現在，什麼沒有變？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c11",n:11, zh:"杏暖", en:"Apricot Warmth", hex:"#E8C0A0",bg:["#C09070","#E8C0A0"],m:"郵差說，他每年最喜歡走那條有杏花的路，那個香出現，他就知道春天真的來了，不是天氣告訴他的，是鼻子告訴他的。那個香讓他想起很小的時候，但他說不清楚是哪一個記憶的畫面。",q:"有什麼記憶最近一直出現？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c12",n:12, zh:"老玫瑰", en:"Old Rose", hex:"#C17B7B",bg:["#A05858","#C17B7B"],m:"成熟的愛意,既濃烈又含蓄。它不再像初戀那樣張揚,但你知道它更深。懂得收放,懂得等待,也懂得在對的時候全然給出。",q:"有什麼事，你現在比以前更懂了？",s:"不需要立刻回答,先感受就好。",tex:"marble"},
  {id:"c13",n:13, zh:"土息", en:"Earth Breath", hex:"#8A6050",bg:["#604038","#8A6050"],m:"農婦翻土的時候，那股氣味升起來。她說，她喜歡這個味道，泥土什麼都能長，什麼都接受，但它從來不說那是它的功勞。它只是在那裡，讓事情發生。",q:"什麼讓你覺得安心？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c14",n:14, zh:"深木息", en:"Deep Wood", hex:"#5A3C28",bg:["#381E10","#5A3C28"],m:"船匠挑木料的時候，他先敲，聽聲音。老木頭的聲音是悶的、沉的，不響亮，但結實。他說，這種木頭做的船，才沉得住，才撐得過大浪。",q:"你最不容易被動搖的是什麼？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c15",n:15, zh:"芙蓉變", en:"Shifting", hex:"#E8B8B8",bg:["#C08888","#E8B8B8"],m:"木芙蓉早上是白的，中午變粉，到了傍晚是深玫瑰色。同一朵花，同一天，三種樣子。看過它的人說，它讓他們覺得，一天裡可以有好幾個自己，都算真的。",q:"你今天和昨天一樣嗎？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c16",n:16, zh:"玫瑰深", en:"Rose Depth", hex:"#B88888",bg:["#906868","#B88888"],m:"香水師說，玫瑰是她最難用的材料，不是因為它不好，是因為太多人認識它的表面，很少人認識它的深度。同樣是玫瑰，有人配出來的是艷麗，有人做出來的是靈魂。",q:"有什麼你沒讓人看見過？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c17",n:17, zh:"桃訊", en:"Signal", hex:"#D8A8A8",bg:["#B07880","#D8A8A8"],m:"渡船老人說，他知道春天來了不是靠天氣，是靠那棵桃樹。只要它開了，他就知道某種轉換來了。他說，你以為自己不在意那棵樹，但看到它開，你還是笑了。",q:"你期待什麼？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c18",n:18, zh:"夜土", en:"Night Soil", hex:"#3A3028",bg:["#201808","#3A3028"],m:"夜行的老婦人說，她不怕黑，因為她知道黑夜是大地在睡覺，不是大地消失了。她走在黑暗裡，腳底踩著土，她說，你只要感覺到腳下是實的，你就知道你在哪裡。",q:"你現在擔心什麼？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c19",n:19, zh:"深潭", en:"Deep Pool", hex:"#2A2018",bg:["#181008","#2A2018"],m:"村子後面有一個深潭，沒有人知道它有多深。但它從來不溢出來，從來不乾，四季都在那裡。守林人說，有些東西你說不清楚，但你知道它都在那，那個知道，比什麼都讓人安心。",q:"有什麼事你從來沒說出口？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c20",n:20, zh:"暖石", en:"Warm Stone", hex:"#B8AEA5",bg:["#988E85","#B8AEA5"],m:"老石牆上的光影,不爭不辯,只是安穩地存在著。它見過風雨,也見過晴天,但它從不說自己經歷了什麼,只是靜靜地站在那裡,讓你靠著。",q:"什麼讓你覺得穩？",s:"不需要立刻回答,先感受就好。",tex:"marble"},
  {id:"c21",n:21, zh:"月灰", en:"Moon Ash", hex:"#D4D0CC",bg:["#ACA8A4","#D4D0CC"],m:"詩人說，月亮本身不發光，但月光讓人寫了多少詩，走過了多少夜路。她說，她很喜歡這件事，有些光，不是你自己發出來的，而是你讓別人的光有了方向。",q:"睡前你在想什麼？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c22",n:22, zh:"蔓玫", en:"Climbing Rose", hex:"#E0B8B8",bg:["#C090A0","#E0B8B8"],m:"那棟老宅的牆上，蔓玫爬了好幾年，現在整面牆都是它的。沒有人替它規劃路線，你給它一根支架，它自己就知道怎麼往上長，怎麼轉彎，怎麼找到下一個方向。",q:"你最近在往哪個方向走？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c23",n:23, zh:"晨金", en:"Morning Gold", hex:"#F0A820",bg:["#C87818","#F0A820"],m:"麵包師傅的學徒每天天亮前就到了，爐子還沒熱，村子還沒醒。那個時刻是他一個人的，橙金色的光從窗縫透進來，他把手放在麵團上，覺得今天什麼都還有可能。",q:"你今天最想做但還沒做的是什麼？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c24",n:24, zh:"穗金", en:"Grain Gold", hex:"#E89030",bg:["#C06818","#E89030"],m:"風來的時候，整片麥田一起動了。村子裡的人都走出來站在路邊，沒有說話，只是看著那片金色在風裡搖。有人笑了，也說不清楚為什麼，只是覺得，這就是那種值得的感覺。",q:"有什麼事你覺得值了？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c25",n:25, zh:"向光", en:"Light Seeking", hex:"#E8D070",bg:["#C0A840","#E8D070"],m:"田邊的向日葵每天都轉，早上朝東，傍晚朝西，跟著太陽走。不是有人告訴它要這樣，是它本來就知道光在哪裡。那個知道，不是學來的，是長在它裡面的。",q:"什麼讓你提起勁？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c26",n:26, zh:"沙息", en:"Sand Breath", hex:"#C4A878",bg:["#A08850","#C4A878"],m:"商旅說，沙丘每天形狀都不一樣，風從哪邊來，它就往哪邊堆。但那片沙漠本身，從來沒有移動過。她說，你要認識的不是今天的形狀，是那片不動的沙漠。",q:"你一直帶著的是什麼？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c27",n:27, zh:"穀暖", en:"Grain Warmth", hex:"#D8C090",bg:["#B8A068","#D8C090"],m:"管糧的老人說，穀倉最重要的不是裝滿，是知道什麼時候打開來用。他說，他見過一些人，倉裡滿得快要溢出來，但從來不動它，那個不動，有時候是謹慎，有時候是別的狀態。",q:"有什麼你捨不得給出去？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c28",n:28, zh:"土深", en:"Deep Earth", hex:"#7A5C3A",bg:["#5A3C1A","#7A5C3A"],m:"考古師說，他挖的不是土，是時間。他說，你挖得越深，你和越遠的事情說話。他每次挖到什麼，都會在那個坑裡坐一下，讓自己感覺那個深度。",q:"對你來說什麼最重要？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c29",n:29, zh:"燭息", en:"Candle Breath", hex:"#F0E0B8",bg:["#D0B880","#F0E0B8"],m:"那個冬天停電了，整條街都黑了。有人點了一根蠟燭放在窗口，那個光很小，照不了多遠，但從街上看進去，那個黃色的光讓人覺得那棟房子裡有人，不孤單。",q:"誰讓你不覺得孤單？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c30",n:30, zh:"石暖", en:"Stone Warmth", hex:"#8A7A68",bg:["#605048","#8A7A68"],m:"傍晚，石板路上的溫度還是暖的，是白天的太陽留下來的。石道的守衛說，他喜歡那個時刻，不是太陽給他的，是石頭替他存著、等他來的。他說，那種溫暖和直接照到的不一樣。",q:"有什麼你一直沒說謝謝？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c31",n:31, zh:"炭黑", en:"Charcoal Black", hex:"#383028",bg:["#201808","#383028"],m:"炭火燒起來是黑的，看起來沉默，看起來冷。但靠近一點，你感覺到熱，穩的，蓬勃的，不像明火那樣張揚，但炭火燒完一頓飯，明火燒一半就滅了。",q:"你付出過的，有什麼留下來了？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c32",n:32, zh:"鐵沉", en:"Iron Silence", hex:"#504840",bg:["#302820","#504840"],m:"鐵匠說，鐵要好，要反覆錘打。不是為了讓它受苦，是讓它更密、更結實，讓它能承受更多的重量。他說，每一次錘打之後，鐵都更像它真正的樣子、更有個性了。",q:"有什麼話你一直沒說？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c33",n:33, zh:"灰寂", en:"Ash Silence", hex:"#706860",bg:["#504848","#706860"],m:"鍛爐師說，灰燼是火燒完之後的樣子。他把它收起來，混進花園的土裡。他說，燒過的東西，不一定是失去，有時候它只是換了一個方式，繼續養著什麼。",q:"有什麼事已經結束了？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c34",n:34, zh:"霜薄", en:"Thin Frost", hex:"#C8C4BC",bg:["#A09C94","#C8C4BC"],m:"清晨的草葉上結了霜，太陽一出來，慢慢就化了。農夫說，霜來了他不怕，因為他知道它會走。他說，知道它會走的，你就能好好等它走完。",q:"最近什麼事讓你覺得累？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c35",n:35, zh:"雲淡", en:"Faint Cloud", hex:"#CCC8C0",bg:["#A4A09A","#CCC8C0"],m:"牧羊人躺在草地上看雲，雲從來不停在同一個地方。他說，雲不是在逃，它是在移動，這兩件事看起來一樣，但感覺完全不同。他說，他花了很多年才分清楚。",q:"有什麼事可以先放著不管？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c36",n:36, zh:"蘆息", en:"Reed Breath", hex:"#D0C8C0",bg:["#A8A09A","#D0C8C0"],m:"風來的時候，蘆葦全部一起彎了，整片都低下去。風走了，它們又一起回來了，還是那樣站著。河邊的老人看了幾十年，說，它的力量不是在它不彎，是在它彎了還能回來。",q:"你怎麼從不好的狀態回來？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c37",n:37, zh:"霧晨", en:"Morning Haze", hex:"#E0DCD4",bg:["#B8B4AC","#E0DCD4"],m:"麵包師傅的學徒每天最早到，霧還沒散，烤爐剛剛點起來，什麼都還不確定。但他說，他喜歡那個時刻，不是因為清楚，是因為他知道自己在對的地方，做對的事。",q:"有什麼事你還看不清楚？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c38",n:38, zh:"牙溫", en:"Ivory Warmth", hex:"#E8DEC0",bg:["#C8B898","#E8DEC0"],m:"收藏家把那塊象牙拿到光下，說，象牙不是白的，是微微黃的，有時間的溫度。他說，他不喜歡太白太潔淨的東西，會讓他覺得還沒開始，有點時間痕跡的，才讓他覺得真實。",q:"什麼讓你覺得自己是真實的？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c39",n:39, zh:"白霧", en:"White Mist", hex:"#E8E4E0",bg:["#C8C4C0","#E8E4E0"],m:"山裡的霧不是突然來的，是慢慢聚攏的。嚮導說，霧讓你看不遠，但也讓你不得不看清楚眼前那一步。有時候，看不見遠方，反而是最好的時機，讓你把眼前的事做好。",q:"有什麼感覺你說不清楚？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c40",n:40, zh:"稻暖", en:"Rice Warmth", hex:"#F0E8D8",bg:["#D8C8A8","#F0E8D8"],m:"收割完的田裡，稻草鋪了一地。農人說，他從來不嫌它，他用它鋪床、蓋屋頂、給牲口取暖。他說，平凡的事物，換一個眼光去用它，它是生活隱藏的美好禮物。",q:"什麼一直在支持你？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c41",n:41, zh:"暖金", en:"Warm Gold", hex:"#F5E6C8",bg:["#D8C8A8","#F5E6C8"],m:"慶祝的時刻,在杯沿閃爍。喜悅不需要理由,有時候只是因為你走到了這裡,只是因為你還在,還願意舉起杯子,對自己說一聲「辛苦了」。",q:"今天有什麼小事讓你開心？",s:"不需要立刻回答,先感受就好。",tex:"marble"},
  {id:"c42",n:42, zh:"新葉光", en:"Fresh Leaf", hex:"#72A030",bg:["#508018","#72A030"],m:"春天第一片新葉是最嫩的綠，透著光，薄薄的，風一吹就抖。但它就是從那麼小開始，一天一天，到了夏天，整棵樹都是它的顏色。",q:"你現在什麼正在開始？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c43",n:43, zh:"芽光", en:"Sprout Light", hex:"#8AAA50",bg:["#688030","#8AAA50"],m:"春天剛萌出來的葉，對著光是透的，綠得像有人在裡面打了燈。藥草師說，這個時候的葉最有生氣，因為它還沒決定它要長成什麼，它所有的可能性都在長大中。",q:"你最近在長成什麼樣子？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c44",n:44, zh:"野息", en:"Wild Breath", hex:"#8A9868",bg:["#607040","#8A9868"],m:"那片荒原沒有人開墾，風一來，整片草都伏下去，風走了，又站起來。旅人問，那裡什麼都沒有，你走它幹什麼？老人說，有時候你需要一個什麼都沒有的地方，才知道自己有什麼。",q:"你需要什麼樣的空間？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c45",n:45, zh:"木灰", en:"Wood Ash", hex:"#A8A898",bg:["#787868","#A8A898"],m:"草木灰是植物燒完之後的樣子，顏色是中性的，淡的，什麼都不主張。陶藝師說，她喜歡用它上釉，因為它不搶任何東西的風頭，卻讓其他顏色都更好看了。",q:"你正在放下什麼？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c46",n:46, zh:"野草息", en:"Wild Grass", hex:"#4A7A38",bg:["#2C5020","#4A7A38"],m:"牆角的野草被拔掉了一次，兩週後又長回來了。同樣的位置，同樣的樣子，像是什麼都沒發生過。鄰居說，你每次拔它，它每次都回來，後來她就不拔了。",q:"有什麼你一直沒有放棄？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c47",n:47, zh:"苔石", en:"Moss Stone", hex:"#5A7048",bg:["#385028","#5A7048"],m:"石板路的縫裡長著苔蘚，深深的綠，沉沉的。沒有人替它澆水，也沒有人特別去看它。路過的孩子說，它看起來很老了。老人說，不是老，是更穩定了，你要分清楚。",q:"有誰一直在你旁邊你沒特別注意？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c48",n:48, zh:"葉深", en:"Leaf Depth", hex:"#384E30",bg:["#203018","#384E30"],m:"村裡的老樹匠說，你記得那朵花，但你有沒有注意到葉子？葉子沒有被看見，但沒有它，花就浮在空氣裡，沒有地方站。他說，最重要的東西，往往是你不注意的那個。",q:"有什麼你忽略了很久？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c49",n:49, zh:"草息", en:"Herb Breath", hex:"#A2B5A0",bg:["#85A085","#A2B5A0"],m:"古老的智慧,生長在荒野。它不需要肥沃的土壤,不需要精心的照顧,自有生命之道。那個道,是它自己走出來的,不是誰教的。",q:"你最確定的一件事是什麼？",s:"不需要立刻回答,先感受就好。",tex:"cloud"},
  {id:"c50",n:50, zh:"竹息", en:"Bamboo", hex:"#5A8860",bg:["#3A6040","#5A8860"],m:"笛匠把竹子截下來，對著光看了看，說，好的竹子要空心，不能塞滿東西。他用它做出來的笛，聲音能穿過整個村子。那個聲音，是因為裡面有空間才有的。",q:"你現在心裡有空間嗎？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c51",n:51, zh:"林息", en:"Forest Breath", hex:"#3A6848",bg:["#224830","#3A6848"],m:"旅人說，她進過雨林一次。那種豐盛讓她喘不過氣，不是因為悶，是因為每個方向都有東西在長，每一步都有新的聲音和氣味，你不知道要先感受哪一個。她說，那讓她想到自己某些時期。",q:"你現在擁有什麼？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c52",n:52, zh:"森深", en:"Forest Deep", hex:"#2A5038",bg:["#183028","#2A5038"],m:"樵夫說，森林看起來是一棵一棵的樹，但地底下，根和根是連著的。他說，你在林子裡站著，以為你是一個人，但你從來不是。那些連結，你看不見，但它一直在那裡。",q:"有什麼事你還沒搞懂？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c53",n:53, zh:"荷光", en:"Lotus Light", hex:"#E0F4E8",bg:["#C0D8D0","#E0F4E8"],m:"冰涼又溫柔,清新中帶著甜。像一陣風吹過額頭,瞬間讓思緒變得清醒。輕盈,不沉重,但卻能讓你重新呼吸。",q:"在很難的時候你靠什麼撐過去？",s:"不需要立刻回答,先感受就好。",tex:"cloud"},
  {id:"c54",n:54, zh:"瓷青", en:"Celadon Glow", hex:"#3A9A88",bg:["#1F6A5C","#3A9A88"],m:"陶藝師說，青瓷的顏色是進窯之後自己燒出來的，她每次打開窯都不知道會是什麼樣子。她學會了等，學會了接受，她說，最美的那一批，往往是她最沒有預期的。",q:"誰最了解你？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c55",n:55, zh:"薄荷息", en:"Mint", hex:"#5AB8A0",bg:["#388870","#5AB8A0"],m:"藥草師把一把新鮮薄荷放在客人面前，說，先聞一下。客人吸了一口氣，眼睛亮了一點。不是因為問題解決了，是因為那一口氣讓她清醒了一下，然後她自己知道該怎麼辦了。",q:"什麼讓你一下子清醒？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c56",n:56, zh:"苔深", en:"Deep Moss", hex:"#2A7A58",bg:["#1A5C40","#2A7A58"],m:"石板路的縫隙裡長出了苔蘚，沒有人種，也沒有人澆水。那個綠，安靜地在那裡，就這樣長著。路過的人要蹲下來才看得見，但它一直都在。",q:"有什麼在你身上慢慢變多？",s:"不需要立刻回答，先感受就好。",tex:"bamboo"},
  {id:"c57",n:57, zh:"冰息", en:"Ice Breath", hex:"#70B8B0",bg:["#4A9090","#70B8B0"],m:"冰川每年只移動幾公分，看起來什麼都沒有在發生。但幾千年後，它走過的地方，是一整條山谷。旅人站在那個谷裡，想不到有什麼東西能這麼慢、這麼有力量。",q:"有什麼在你不注意的時候改變了？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c58",n:58, zh:"晨露", en:"Morning Dew", hex:"#B8D0C8",bg:["#88A8A0","#B8D0C8"],m:"清晨的草葉上有露水，每一滴都是夜裡積的。太陽一出來，它們安靜地消失了，不留痕跡，但那片草卻因為它喝飽了水，整個早上都是最飽和的綠。",q:"有什麼你知道不會長久？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c59",n:59, zh:"海岸", en:"Coast", hex:"#5090A0",bg:["#306878","#5090A0"],m:"燈塔守燈人說，他最喜歡站在海岸線上，那裡，浪每天都來，每天都退，兩件完全不同的事在這裡相遇，誰也沒有把誰淹掉，但兩邊都因為對方有了形狀。",q:"你和什麼之間需要一條線？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c60",n:60, zh:"湖心", en:"Lake Heart", hex:"#4A9898",bg:["#2A6868","#4A9898"],m:"她划船到湖的正中間，把槳放下來，讓船自己漂著。四面都是岸，四面都是遠。她說，只有在那裡，她才覺得思緒能攤開來，不會馬上被拉走。",q:"有什麼事你還沒看懂？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c61",n:61, zh:"泉清", en:"Clear Spring", hex:"#88C0C0",bg:["#5898A0","#88C0C0"],m:"挖井人說，泉水不是你做出來的，是你找出來的。他挖了一輩子的井，每一次找到泉，都不是在他預期的地方。他說，他學會了一件事：放下你以為它會在哪裡的那個想法。",q:"有什麼是你一直可以依賴的？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c62",n:62, zh:"藍霧", en:"Blue Mist", hex:"#B4C7D9",bg:["#90A8C0","#B4C7D9"],m:"清晨的薄霧,模糊了遠山的輪廓。世界變得柔軟,邊界不再那麼銳利。在這片寧靜裡,你終於聽見了自己的呼吸。",q:"有什麼你很難解釋？",s:"不需要立刻回答,先感受就好。",tex:"cloud"},
  {id:"c63",n:63, zh:"藍寂", en:"Sea Depth", hex:"#1A4A8A",bg:["#0E2A5C","#1A4A8A"],m:"漁夫說，他出海最怕的不是風浪，是那種太藍太深的海，深到你不知道底下有什麼，也不知道那個「不知道」是讓你害怕，還是讓你想靠近。他每次還是划過去了。",q:"什麼讓你很難動搖？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c64",n:64, zh:"湖沉", en:"Lake Sink", hex:"#3A5080",bg:["#203060","#3A5080"],m:"湖邊的老人每天來坐，不帶魚竿，只是看。他說，湖面有風有波，但湖底是另一個世界，安靜，慢，什麼都在，但什麼都不急。他說，他來這裡是為了記得那種感覺。",q:"有什麼你放在心裡最底下？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c65",n:65, zh:"靛深", en:"Indigo Deep", hex:"#2A3A6A",bg:["#161E48","#2A3A6A"],m:"染布要一遍一遍來，每一遍都是同樣的動作，泡進去、拿出來、晾著，再泡。顏色就這樣一層一層加深，從淺藍到深靛，沒有捷徑，但每一遍都算數。",q:"你現在最深的感受是什麼？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c66",n:66, zh:"深海藍", en:"Deep Ocean", hex:"#2E4A6B",bg:["#1A3050","#2E4A6B"],m:"深海的寂靜,包容一切暗湧。表面可能是波濤,但在深處,一切都是穩定的。你在那個深處找到了力量,一種不被外界動搖的穩定。",q:"有什麼一直讓你覺得穩？",s:"不需要立刻回答,先感受就好。",tex:"dragon"},
  {id:"c67",n:67, zh:"墨色", en:"Ink", hex:"#162850",bg:["#0A1430","#162850"],m:"抄書人把羽毛筆蘸進墨水的那一刻，停了一秒。筆尖還沒碰到紙，但他已經知道自己要寫什麼了。那一秒，他覺得整個故事都在筆裡等著，只要他開始。",q:"有什麼已經成為你的一部分？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c68",n:68, zh:"暮藍", en:"Dusk Blue", hex:"#2A4060",bg:["#162438","#2A4060"],m:"鐘樓的守時人說，黃昏是最難撥的時刻，光和暗同時存在，你說哪個是主角都說不準。她每次都在那個時刻停一下，讓自己在兩種光裡都待一會兒，才繼續。",q:"一天快結束的時候你在想什麼？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c69",n:69, zh:"夜緩", en:"Night Slow", hex:"#0E1E40",bg:["#060E28","#0E1E40"],m:"守夜人說，很多人以為夜空是空的，其實不是，是滿的。你要讓眼睛先習慣黑暗，等一會兒，星星才慢慢出來。不是星星後來才有的，是你的眼睛準備好了。",q:"什麼讓你覺得世界很大？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c70",n:70, zh:"蘭夜", en:"Orchid Night", hex:"#483860",bg:["#302848","#483860"],m:"夜市散了，香料師還沒收攤。她說，夜蘭只在晚上開，白天你完全不知道它在那裡。但入夜之後，整條街最深的香，是它的。她說，有些東西，你要等到夜裡才知道它有多好。",q:"有什麼只有你自己知道？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c71",n:71, zh:"草紫", en:"Lavender Herb", hex:"#A8A0C0",bg:["#807898","#A8A0C0"],m:"旅館管家說，她在每個枕頭下都放薰衣草。她說，她最在意的事，就是讓客人在這裡能放下來，不用想事情，不用表現什麼，就只是好好休息。她說，那是她能給人最好的東西。",q:"有什麼你記得很久了？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c72",n:72, zh:"藤垂", en:"Hanging Vine", hex:"#B0A8C8",bg:["#888098","#B0A8C8"],m:"老宅的紫藤爬了五十年，現在已經長過牆，垂到另一邊去了。沒有人修剪它，也沒有人規劃它的方向。主人說，它的路，比她聰明，她就讓它去了。",q:"有什麼事一直還沒解決？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c73",n:73, zh:"煙淡", en:"Faint Smoke", hex:"#C0B8C8",bg:["#988898","#C0B8C8"],m:"那條山路她走過很多次，但霧天走起來完全不一樣。手伸出去看不見指尖，前面的路也消失了。她停下來，然後發現，腳其實知道怎麼走。不是她的眼睛帶她走的，是她的身體跟心。",q:"有什麼在你生命裡慢慢淡了？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c74",n:74, zh:"紫霧", en:"Purple Mist", hex:"#C8B4D0",bg:["#A890B0","#C8B4D0"],m:"記憶中的薰衣草田,香氣還在風裡徘徊。時光輕柔地把一切包裹起來,留下的不是清晰的畫面,而是一種溫暖的氛圍,一種「曾經美好」的確信。",q:"你現在是什麼心情？",s:"不需要立刻回答,先感受就好。",tex:"cloud"},
  {id:"c75",n:75, zh:"尾孤", en:"Lone Iris", hex:"#704868",bg:["#503050","#704868"],m:"畫師說，鳶尾讓他困擾了很多年，你說它是紫的，它帶著藍；你說它是藍的，它又明明是紫的。後來他放棄分類，也不想要命名的那一刻，它是最美的。",q:"有什麼你說不清楚自己是什麼感覺？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c76",n:76, zh:"嵐紫", en:"Purple Haze", hex:"#907890",bg:["#685870","#907890"],m:"傍晚的山嵐是紫的，不是因為什麼神秘的原因，是光線和霧氣在那個時刻剛好這樣相遇。山寺的僧侶說，很多美麗的東西都是這樣的，不是刻意的，是你剛好在那裡，它剛好就在。",q:"有什麼你還在想？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c77",n:77, zh:"芋柔", en:"Soft Taro", hex:"#C0A8B8",bg:["#988090","#C0A8B8"],m:"那碗芋頭湯沒有什麼特別的材料，但喝過的人都說，是家的味道。廚師說，她不知道為什麼，她只是每次都認真做。她說，有些東西不是因為特別才讓人記得，是因為它讓你回到自己。",q:"你最柔軟的地方在哪裡？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c78",n:78, zh:"暮薄", en:"Thin Twilight", hex:"#C0A8C0",bg:["#987898","#C0A8C0"],m:"傍晚的廚房裡，母親在切菜，光線從窗子進來，剛好打在她的手上。沒有人說話，只有刀聲和香氣。多年以後，那個孩子說，那是她記憶裡最安靜的顏色。",q:"你在猶豫什麼？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c79",n:79, zh:"胭紅", en:"Carmine", hex:"#CC2E60",bg:["#A01840","#CC2E60"],m:"村子後山的杜鵑，沒有人替它規劃開花的時間。春天一到，它就開了，開得毫不猶豫，整片山坡都染成那個紅。村民說，這棵樹年年開，從來不問今年適不適合。",q:"什麼讓你覺得很活著？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c80",n:80, zh:"薔野", en:"Wild Bramble", hex:"#B83040",bg:["#882030","#B83040"],m:"那叢薔薇沒有人種，就這樣長在村子外面的石牆上。每年春天，沒有任何人特別去看它，但它自己就開了，開得滿滿的，一點都不客氣。",q:"有什麼你不需要別人同意就很確定？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c81",n:81, zh:"染深", en:"Deep Dye", hex:"#9A1838",bg:["#700818","#9A1838"],m:"老染匠說，胭紅要染得深，布要泡上三天才能出那個顏色。她說，那個深，不是加出來的，是時間留進去的。她一次都沒有偷工，因為她知道，顏色不會騙人。",q:"誰或什麼對你影響最深？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c82",n:82, zh:"霞暮", en:"Dusk Glow", hex:"#C84858",bg:["#A03040","#C84858"],m:"旅館老闆娘送走最後一批客人，站在門口目送他們走進晚霞裡。粉紅和橘紅把整條路染成了另一種顏色。她看著看著，心裡升起一種淡淡的溫暖，是某種「好好完成了」的感覺。",q:"你道別過什麼？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c83",n:83, zh:"粉透", en:"Translucent Pink", hex:"#E0607C",bg:["#B83858","#E0607C"],m:"調色師把那瓶顏料拿到光下，裡面的粉紅透了出來，像是有什麼從裡面點亮的。她說，這個顏色只有在光裡才看得出它真正的樣子，你要對著它，它才給你看。",q:"有什麼你藏不住？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c84",n:84, zh:"含苞", en:"Sealed Bud", hex:"#881428",bg:["#600010","#881428"],m:"花販說，他最喜歡賣的就是含苞的，顏色最深，能量都還醞釀在裡面，沒有散掉。他說，開了的花美，但含苞的花，讓人想等。那個等，是有重量的信任。",q:"有什麼話你還沒說？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c85",n:85, zh:"梅寒", en:"Cold Plum", hex:"#A83850",bg:["#802840","#A83850"],m:"冬天最冷的那一週，村子後面的梅樹開了。沒有其他花，沒有葉子，只有那一樹粉紅在灰白的天空下。來看的人都說不出話，只是站著，覺得有什麼東西在心裡被碰觸了。",q:"在很難的時候你怎麼還撐著？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c86",n:86, zh:"石榴", en:"Pomegranate", hex:"#902840",bg:["#681828","#902840"],m:"市集裡有人切開一顆石榴，裡面每一粒都是紅寶石的顏色，密密麻麻，飽滿到快要溢出來。外皮看起來粗糙普通，但打開來，是一整個豐盛的世界。",q:"你現在感覺最充實的是什麼？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c87",n:87, zh:"藥放", en:"Blooming Peony", hex:"#B87880",bg:["#906068","#B87880"],m:"芍藥開的時候，整個花球大得讓人覺得不真實，粉紅色層層疊疊，飽滿，張揚，毫不保留。它就那樣開著，沒有任何道歉的樣子。路過的人都停下來了。",q:"有什麼你想全部給出去？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c88",n:88, zh:"藕紋", en:"Lotus Root Mark", hex:"#C89098",bg:["#A07078","#C89098"],m:"荷塘邊，有人把蓮藕切開，截面是白的，一個一個圓孔，整齊又乾淨。它長在最深的泥裡，但你打開它，是那樣的樣子。她看著那個截面，好像想到了過去。",q:"你給別人看的和你真實的，一樣嗎？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c89",n:89, zh:"蜜琥", en:"Honey Amber", hex:"#D4A430",bg:["#B88418","#D4A430"],m:"養蜂人把蜂巢拿到光下看，那層蜜是金黃帶點琥珀色的，很濃稠，慢慢流下來。他說，蜜的顏色深淺，是看蜂去了哪些花，每一批都不一樣，但都甜。",q:"有什麼是你花了很長時間才有的？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c90",n:90, zh:"薑黃", en:"Turmeric Gold", hex:"#E8A018",bg:["#C08010","#E8A018"],m:"染坊的師傅說，薑黃染出來的布料，剛染好是亮的金黃色，但它不刺眼。洗過曬過，顏色會慢慢變深，但不會褪，反而越來越沉穩。她說，好的顏色是會陪你變老的。",q:"有什麼事你越來越確定？",s:"不需要立刻回答，先感受就好。",tex:"dragon"},
  {id:"c91",n:91, zh:"晨曦", en:"Dawn Light", hex:"#FFD8B8",bg:["#E8B898","#FFD8B8"],m:"天剛亮的時候，天空是淡淡的粉橘色。漁夫說，這個顏色出現，他就知道今天是個好天。那個顏色很柔，不刺眼，像是天空在說，可以出發了。",q:"今天什麼開始了？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c92",n:92, zh:"珍珠光", en:"Pearl Glow", hex:"#F8F0E8",bg:["#E0D8D0","#F8F0E8"],m:"珍珠在光下轉動，每個角度都不一樣，有時候是白的，有時候是粉的，有時候帶點藍。珠寶師說，珍珠的美不是固定的，是會變的，要看你怎麼看它。",q:"你是什麼樣的人，要看在什麼情況下？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c93",n:93, zh:"薔薇粉", en:"Rose Pink", hex:"#F4D0D8",bg:["#D8B0B8","#F4D0D8"],m:"早春的薔薇剛開，顏色還很淡，粉粉的，嫩嫩的。園丁說，這個時候的薔薇最脆弱，但也最美。那個粉色，像是還沒準備好，但已經來了。",q:"有什麼剛進來你的生活？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c94",n:94, zh:"檸檬淡", en:"Pale Lemon", hex:"#F8F0C0",bg:["#E0D8A8","#F8F0C0"],m:"檸檬樹上，有些果子還沒熟，顏色是淡淡的黃綠色。果農說，這個時候的檸檬最酸，但汁最多。那個顏色，是還在路上的感覺。",q:"有什麼還在準備中？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c95",n:95, zh:"青檸", en:"Lime", hex:"#C8E8A8",bg:["#A8C888","#C8E8A8"],m:"市場裡的青檸，綠得很亮，酸得很爽快。攤販說，青檸跟檸檬不一樣，它的酸是清的，不會悶，聞一下就醒了。",q:"什麼讓你立刻清醒？",s:"不需要立刻回答，先感受就好。",tex:"wave"},
  {id:"c96",n:96, zh:"水綠", en:"Water Green", hex:"#C0E0D0",bg:["#A0C8B8","#C0E0D0"],m:"湖水在淺灘的地方是透明的綠色，能看見底下的石頭和水草。游泳的人說，這個顏色讓她覺得安全，因為她知道底下有什麼。",q:"你讓別人看得清楚嗎？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c97",n:97, zh:"青瓷淡", en:"Pale Celadon", hex:"#D0E8E0",bg:["#B0C8C0","#D0E8E0"],m:"那只茶杯是青瓷的，顏色很淡，淡到幾乎看不出來。茶師說，這種顏色的杯子最好，不會搶茶的顏色，讓茶自己說話。",q:"有什麼你不說，但一直在？",s:"不需要立刻回答，先感受就好。",tex:"fish"},
  {id:"c98",n:98, zh:"天青", en:"Sky Blue", hex:"#A8C8E0",bg:["#88A8C0","#A8C8E0"],m:"晴天的天空，藍得很乾淨，沒有一片雲。孩子們躺在草地上看天空，說，這個藍色好像會動，但又沒有動。那個藍，讓人想飛。",q:"有什麼讓你想要更自由？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c99",n:99, zh:"晴空", en:"Clear Sky", hex:"#C8D8F0",bg:["#A8B8D0","#C8D8F0"],m:"雨後的天空，藍得很透，空氣也是濕濕的。曬衣服的人說，這種天空出現，她就知道衣服會乾得很快。那個藍，是乾淨的承諾。",q:"你答應過自己什麼？",s:"不需要立刻回答，先感受就好。",tex:"cloud"},
  {id:"c100",n:100, zh:"丁香", en:"Lilac", hex:"#D8C8E8",bg:["#B8A8C8","#D8C8E8"],m:"庭院裡的丁香開了，淡淡的紫色，香氣很甜。鄰居說，丁香開的時候，整條街都是香的。那個紫色，是溫柔的提醒。",q:"有什麼一直在提醒你？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c101",n:101, zh:"薰衣草淡", en:"Pale Lavender", hex:"#E8D8F0",bg:["#C8B8D0","#E8D8F0"],m:"薰衣草田的盡頭，顏色變淡了，淡到幾乎是白的。但那個香還在，甚至更明顯。香水師說，有時候顏色淡了，香氣反而更清楚。",q:"有什麼越來越淡，但你反而越來越懂它？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c102",n:102, zh:"石灰", en:"Limestone", hex:"#E0D8C8",bg:["#C0B8A8","#E0D8C8"],m:"老牆是石灰砌的，白白的，但不是純白，是帶點灰的白。師傅說，石灰會呼吸，會吸水，會放水，它跟房子一起活著。",q:"有什麼陪著你走了很久？",s:"不需要立刻回答，先感受就好。",tex:"marble"},
  {id:"c103",n:103, zh:"米白", en:"Rice White", hex:"#F0E8D8",bg:["#D0C8B8","#F0E8D8"],m:"米缸裡的米，白得很柔和，不刺眼。煮飯的人說，好的米要有點油光，那個白不是死白，是活的白。",q:"你身上什麼是有生命的？",s:"不需要立刻回答，先感受就好。",tex:"wave"},

        const allIn=reduced.matches?1:Math.min(1,Math.max(0,(elapsed-delay*(n-1))/fade)),breath=reduced.matches?.5:.5+.5*Math.sin(now*.0004);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=allIn*.07*breath;const cg=ctx.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.min(W,H)*.45);cg.addColorStop(0,'rgba(255,248,235,1)');cg.addColorStop(1,'rgba(255,248,235,0)');ctx.fillStyle=cg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
        const fadeH=H*.3,fg=ctx.createLinearGradient(0,H-fadeH,0,H);fg.addColorStop(0,'rgba(13,10,7,0)');fg.addColorStop(.6,'rgba(13,10,7,.7)');fg.addColorStop(1,'rgba(13,10,7,1)');ctx.fillStyle=fg;ctx.fillRect(0,H-fadeH,W,fadeH);
        if(!reduced.matches&&document.visibilityState==='visible')state.raf=requestAnimationFrame(frame);
      } frame(performance.now());
    }
    $('startDraw').addEventListener('click',prepareDraw); $('openOverview').addEventListener('click',()=>openOverview('welcome')); $('overviewBackTop').addEventListener('click',leaveOverview); $('overviewBackBottom').addEventListener('click',()=>{state.overviewReturn='welcome';leaveOverview();setTimeout(prepareDraw,120)}); $('paletteSearch').addEventListener('input',event=>{renderOverview(event.target.value);requestAnimationFrame(observeSpectrumGroups);});
    $('filterRow').addEventListener('click',event=>{const button=event.target.closest('[data-filter]');if(!button)return;state.overviewFilter=button.dataset.filter;document.querySelectorAll('.filter-chip').forEach(chip=>chip.classList.toggle('active',chip===button));renderOverview($('paletteSearch').value);requestAnimationFrame(observeSpectrumGroups);});
    $('paletteList').addEventListener('click',event=>{const button=event.target.closest('[data-card-id]');if(button)openCardDialog(CARDS.find(card=>card.id===button.dataset.cardId));});
    $('ritualStack').addEventListener('click',event=>{const button=event.target.closest('[data-card-id]');if(button)openCardDialog(CARDS.find(card=>card.id===button.dataset.cardId));});
    $('cardButton').addEventListener('click',()=>state.revealed?openCardDialog(state.current):revealCard()); $('revealButton').addEventListener('click',revealCard); $('scrollCue').addEventListener('click',()=>{$('readingZh').scrollIntoView({behavior:reduced.matches?'auto':'smooth',block:'start'});$('scrollCue').classList.add('hidden');});
    $('addCard').addEventListener('click',()=>{if(state.selected.length<2)prepareDraw();});
    $('restartReading').addEventListener('click',restartSession);
    $('dialogClose').addEventListener('click',closeCardDialog);$('cardDialog').addEventListener('click',event=>{if(event.target===$('cardDialog'))closeCardDialog();});
    window.addEventListener('resize',()=>{clearTimeout(state.resizeTimer);state.resizeTimer=setTimeout(()=>{if(state.revealed){renderRitualCards();startBlendAnimation(state.selected);}else drawWaitingBackground();},180)});
    reduced.addEventListener?.('change',()=>state.revealed?startBlendAnimation(state.selected):drawWaitingBackground());
